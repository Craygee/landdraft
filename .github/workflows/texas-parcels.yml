name: Texas public parcel refresh
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: texas-parcel-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check public source and license
        run: node tools/texas-parcels-sync.mjs
      - name: Test parcel source schema compatibility
        run: python tools/test_texas_parcels_schema.py
      - name: Verify publisher credential and storage
        env:
          PARCEL_PUBLISH_TOKEN: ${{ secrets.PARCEL_PUBLISH_TOKEN }}
        run: node tools/texas-parcels-publisher-check.mjs
      - name: Compare hosted edition
        id: edition
        run: node tools/texas-parcels-refresh-needed.mjs
      - name: Prepare disk space
        if: steps.edition.outputs.needed == 'true'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install geospatial dependencies
        if: steps.edition.outputs.needed == 'true'
        run: pip install pyogrio==0.13.0 shapely==2.1.2 pyarrow==25.0.1 pyproj==3.8.0
      - name: Download and verify complete archive
        if: steps.edition.outputs.needed == 'true'
        run: node tools/texas-parcels-sync.mjs --download
      - name: Inspect and index
        if: steps.edition.outputs.needed == 'true'
        run: |
          python tools/texas-parcels-inspect.py
      - name: Build spatial index for a new source edition
        if: steps.edition.outputs.mode == 'full'
        run: |
          python tools/texas-parcels-index.py
      - name: Reuse hosted spatial manifest for search backfill
        if: steps.edition.outputs.mode == 'search-only'
        run: node tools/texas-parcels-prepare-search-backfill.mjs
      - name: Build statewide attribute-search index
        if: steps.edition.outputs.needed == 'true'
        run: |
          python tools/texas-parcels-search-index.py
      - name: Publish verified version
        if: steps.edition.outputs.needed == 'true'
        env:
          PARCEL_PUBLISH_TOKEN: ${{ secrets.PARCEL_PUBLISH_TOKEN }}
          PARCEL_SEARCH_ONLY: ${{ steps.edition.outputs.mode == 'search-only' && '1' || '0' }}
        run: node tools/texas-parcels-upload.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: parcel-source-check
          path: .data/texas-parcels/latest-check.json
          retention-days: 30
